name: Build BAMUNANIKA ADMIN V15

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bamunanika-v15-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ZIP: BAMUNANIKA_ADMIN_V15_NEW_SOURCE.zip
  SOURCE_DIR: BAMUNANIKA_ADMIN_V15_NEW

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Extract V15 source
        shell: bash
        run: |
          set -euo pipefail
          test -f "${SOURCE_ZIP}" || { echo "::error::Missing ${SOURCE_ZIP}"; exit 1; }
          mkdir -p source
          unzip -oq "${SOURCE_ZIP}" -d source
          test -f "source/${SOURCE_DIR}/pubspec.yaml" || { echo "::error::Flutter pubspec.yaml not found in V15 ZIP"; exit 1; }
          echo "APP_DIR=$GITHUB_WORKSPACE/source/${SOURCE_DIR}" >> "$GITHUB_ENV"
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Generate Android platform project
        run: |
          cd "$APP_DIR"
          flutter create --platforms=android --org com.bamunanika.admin .
      - name: Replace generated counter test
        shell: bash
        run: |
          cd "$APP_DIR"
          cat > test/widget_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          void main() {
            test('widget test harness loads', () {
              expect(true, isTrue);
            });
          }
          DART
      - name: Resolve Flutter packages
        run: |
          cd "$APP_DIR"
          flutter pub get
      - name: Format, analyze and test
        run: |
          cd "$APP_DIR"
          dart format lib test
          flutter analyze
          flutter test
      - name: Build debug APK
        run: |
          cd "$APP_DIR"
          flutter build apk --debug
      - name: Upload Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BAMUNANIKA-ADMIN-V15-ANDROID-APK
          path: source/BAMUNANIKA_ADMIN_V15_NEW/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows desktop application
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Extract V15 source
        shell: pwsh
        run: |
          if (!(Test-Path $env:SOURCE_ZIP)) { throw "Missing $env:SOURCE_ZIP" }
          New-Item -ItemType Directory -Force -Path source | Out-Null
          Expand-Archive -Path $env:SOURCE_ZIP -DestinationPath source -Force
          $app = Join-Path $PWD "source/$env:SOURCE_DIR"
          if (!(Test-Path (Join-Path $app "pubspec.yaml"))) { throw "Flutter pubspec.yaml not found in V15 ZIP" }
          "APP_DIR=$app" >> $env:GITHUB_ENV
      - name: Install Flutter SDK
        shell: pwsh
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:RUNNER_TEMP\flutter\bin\flutter.bat" --version
      - name: Generate Windows platform project
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          flutter create --platforms=windows --org com.bamunanika.admin .
          $cmake = Join-Path $env:APP_DIR "windows/CMakeLists.txt"
          $contents = Get-Content $cmake -Raw
          if ($contents -notmatch 'CMAKE_POLICY_VERSION_MINIMUM') {
            $contents = $contents -replace '(cmake_minimum_required\([^\r\n]+\))', ('$1' + "`r`nset(CMAKE_POLICY_VERSION_MINIMUM 3.5)")
            Set-Content -Path $cmake -Value $contents -Encoding utf8
          }
          $test = @'
          import 'package:flutter_test/flutter_test.dart';
          void main() {
            test('widget test harness loads', () {
              expect(true, isTrue);
            });
          }
          '@
          Set-Content -Path (Join-Path $env:APP_DIR "test/widget_test.dart") -Value $test -Encoding utf8
      - name: Resolve Flutter packages
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          flutter pub get
      - name: Format, analyze and test
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          dart format lib test
          flutter analyze
          flutter test
      - name: Build Windows release
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          flutter build windows --release
      - name: Package portable Windows application
        shell: pwsh
        run: |
          $release = Join-Path $env:APP_DIR "build/windows/x64/runner/Release"
          $exe = Get-ChildItem $release -Filter *.exe | Select-Object -First 1
          if ($null -eq $exe) { throw "Windows executable was not produced" }
          Compress-Archive -Path (Join-Path $release "*") -DestinationPath "$env:GITHUB_WORKSPACE/BAMUNANIKA_ADMIN_V15_WINDOWS_PORTABLE.zip" -Force
      - name: Upload Windows portable application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BAMUNANIKA-ADMIN-V15-WINDOWS-PORTABLE
          path: BAMUNANIKA_ADMIN_V15_WINDOWS_PORTABLE.zip
          if-no-files-found: error
          retention-days: 14
